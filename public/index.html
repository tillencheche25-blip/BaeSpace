<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BaeSpace</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="partner-info">
                <div class="avatar-small"></div>
                <div>
                    <h4 id="current-room-title">BaeSpace</h4>
                    <span class="status-online" id="room-status">Connected & Encrypted</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Security Settings" onclick="showAuthModal()">🔑</button>
            </div>
        </header>

        <!-- Main Screen -->
        <main class="main-content">
            <div class="screen-view active" id="chat-screen">
                <div class="messages-area" id="messages-container">
                    <!-- Dynamic WhatsApp Messages -->
                </div>

                <div class="chat-input-bar">
                    <input type="text" id="chat-input" placeholder="Type a message..."
                        onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-overlay active">
        <div class="auth-box">
            <h2>BaeSpace</h2>
            <p style="font-size: 0.85rem; color: #a0a5ba; margin-bottom: 12px;">Connect privately with your partner</p>

            <div class="input-group">
                <input type="email" id="auth-email" placeholder="Email Address">
            </div>
            <div class="input-group">
                <input type="password" id="auth-password" placeholder="Password">
            </div>
            <div class="input-group">
                <input type="text" id="auth-room-code" placeholder="Shared Room Code (e.g. 1111)">
            </div>

            <button class="primary-btn" id="auth-submit-btn" onclick="handleLogin()">Log In</button>

            <p style="margin-top: 14px; font-size: 0.85rem; color: #a0a5ba;">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a href="#" id="auth-toggle-link" style="color: #ff2a75; font-weight: 600;"
                    onclick="toggleAuthMode(event)">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js?v=5"></script>
</body>

</html>
