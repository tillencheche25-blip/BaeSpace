<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartSync - Private Partner Connect</title>

    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f0d13">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Splash Screen Animation -->
    <div id="splash-screen" class="splash-overlay">
        <div class="splash-content">
            <img src="/icon.png" alt="HeartSync Logo" class="splash-logo">
            <h2>HeartSync</h2>
            <p style="color: var(--text-secondary); margin-top: 8px;">Securing your private space...</p>
        </div>
    </div>

    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="partner-info">
                <img src="/icon.png" alt="Logo" class="avatar-small-img" id="app-header-icon">
                <div>
                    <h1 id="current-room-title">HeartSync</h1>
                    <span id="room-status" class="status-online">Connected & Encrypted</span>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" class="icon-btn" onclick="showAuthModal()"
                    title="Switch Account / Room">🔑</button>
            </div>
        </header>

        <!-- Main Screen View -->
        <main class="main-content">
            <div id="messages-container" class="messages-area"></div>
        </main>

        <!-- Chat Input Bar -->
        <div class="chat-input-container">
            <!-- Hidden Attachment Preview -->
            <div id="image-preview-bar" class="image-preview-bar" style="display: none;">
                <img id="image-preview" class="preview-thumbnail" src="" alt="Attachment Preview">
                <span style="font-size: 0.8rem; flex: 1;">Image attached</span>
                <button type="button" class="remove-img-btn" onclick="clearSelectedImage()">✕</button>
            </div>

            <div class="chat-input-bar">
                <button type="button" class="attach-btn"
                    onclick="document.getElementById('file-input').click()">📷</button>
                <input type="file" id="file-input" accept="image/*" style="display: none;"
                    onchange="handleImageSelect(event)">

                <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)"
                    autocomplete="off">
                <button type="button" class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Auth / Room Join Modal -->
    <div id="auth-modal" class="auth-overlay">
        <div class="auth-box">
            <img src="/icon.png" alt="Logo" class="auth-logo-img">
            <h2 id="auth-title">HeartSync</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px; font-size: 0.85rem;">
                Connect privately with your partner
            </p>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="input-group">
                    <input type="email" id="auth-email" placeholder="Email Address" required autocomplete="email">
                </div>

                <div class="input-group">
                    <input type="password" id="auth-password" placeholder="Password" required
                        autocomplete="current-password">
                </div>

                <div class="input-group">
                    <input type="text" id="auth-room-code" placeholder="Room Code (e.g. 1111)" required>
                </div>

                <button type="submit" id="auth-submit-btn" class="primary-btn">Log In</button>
            </form>

            <p style="margin-top: 16px; font-size: 0.85rem; color: var(--text-secondary);">
                <span id="auth-toggle-text">Don't have an account?</span>
                <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)"
                    style="color: var(--accent-pink); font-weight: 600; text-decoration: none;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>

</html>
